# Shared body of the RULER task yamls in this directory (each one includes it; see quasar_ruler.py).
# Raw completion (no chat template), greedy; one length per run via
# --metadata '{"max_seq_lengths":[L]}', subsampled with --limit.
tag:
  - longcxt
dataset_path: ""
dataset_name: ""
output_type: generate_until
test_split: test
doc_to_text: "{{input}}"
doc_to_target: "{{outputs}}"
gen_prefix: "{{gen_prefix}}"
target_delimiter: " "
process_results: !function quasar_ruler.process_results
metric_list:
  - metric: "4096"
    aggregation: !function quasar_ruler.aggregate_metrics
    higher_is_better: true
  - metric: "8192"
    aggregation: !function quasar_ruler.aggregate_metrics
    higher_is_better: true
  - metric: "16384"
    aggregation: !function quasar_ruler.aggregate_metrics
    higher_is_better: true
  - metric: "32768"
    aggregation: !function quasar_ruler.aggregate_metrics
    higher_is_better: true
  - metric: "65536"
    aggregation: !function quasar_ruler.aggregate_metrics
    higher_is_better: true
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 128
  until: []
repeats: 1
metadata:
  version: 1.0
